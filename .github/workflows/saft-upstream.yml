name: saft-upstream

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  inspect-official-saft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official ERST SAF-T upstream
        run: bash tests/integration/inspect-erst-saft.sh
