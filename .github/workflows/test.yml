name: test

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: find dkmodul tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Domain unit tests
        run: |
          for test in tests/unit/*Test.php; do
            php -d zend.assertions=1 -d assert.exception=1 "$test"
          done

  bookkeeping-immutability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dolibarr 24.0.1 / MariaDB integration test
        run: bash tests/integration/test-bookkeeping-immutability.sh
