name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: find dkmodul tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Domain unit tests
        run: |
          for test in tests/unit/*Test.php; do
            php -d zend.assertions=1 -d assert.exception=1 "$test"
          done

  bookkeeping-immutability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub for integration image pulls
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Provision dedicated controlled-delete database identity
        run: |
          docker compose -f tests/integration/docker-compose.yml up -d
          for _ in $(seq 1 120); do
            if docker compose -f tests/integration/docker-compose.yml exec -T dolibarr test -f /var/www/documents/install.lock >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose -f tests/integration/docker-compose.yml exec -T mariadb mariadb -uroot -proot dolidb -e "
            CREATE USER IF NOT EXISTS 'dkmodul_delete'@'%' IDENTIFIED BY 'integration-only';
            ALTER USER 'dkmodul_delete'@'%' IDENTIFIED BY 'integration-only';
            GRANT SELECT, DELETE ON dolidb.llx_accounting_bookkeeping TO 'dkmodul_delete'@'%';
            GRANT SELECT, INSERT ON dolidb.llx_dk_audit_event TO 'dkmodul_delete'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Dolibarr 24.0.1 / MariaDB integration test
        run: bash tests/integration/test-bookkeeping-immutability.sh
