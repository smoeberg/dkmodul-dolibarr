name: test

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: find dkmodul tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Domain unit tests
        run: php -d zend.assertions=1 -d assert.exception=1 tests/unit/PostingGuardTest.php
